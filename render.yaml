# Render Blueprint — deploys the ClickMart backend (Django API) and
# frontend (React static site) together.
#
# Secrets/values marked `sync: false` must be filled in the Render dashboard
# (they are NOT stored in this file). See README / DEPLOYMENT for details.

services:
  # ---------------------------------------------------------------
  # Backend — Django REST API (Gunicorn, native Python runtime)
  # ---------------------------------------------------------------
  - type: web
    name: clickmart-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn clickmart_main.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: ACCESS_TOKEN_EXPIRY
        value: "180"
      - key: REFRESH_TOKEN_EXPIRY
        value: "7"
      # --- set these in the dashboard (sync: false) ---
      - key: DATABASE_URL             # Neon connection string (postgresql://...sslmode=require)
        sync: false
      - key: CLOUDINARY_URL           # cloudinary://<api_key>:<api_secret>@<cloud_name>
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD      # Gmail app password (no spaces)
        sync: false
      - key: CORS_ALLOWED_ORIGINS     # e.g. https://clickmart-frontend.onrender.com
        sync: false
      - key: CSRF_TRUSTED_ORIGINS     # e.g. https://clickmart-frontend.onrender.com
        sync: false

  # ---------------------------------------------------------------
  # Frontend — React (Vite) build served as a static site + CDN
  # ---------------------------------------------------------------
  - type: web
    name: clickmart-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Vite inlines this at build time → set to the backend URL + /api/v1
      # e.g. https://clickmart-backend.onrender.com/api/v1
      - key: VITE_SERVER_BASE_URL
        sync: false
    routes:
      # SPA fallback so client-side routes (e.g. /dashboard) resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
